<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="653px" preserveAspectRatio="none" style="width:790px;height:653px;background:#FFFFFF;" version="1.1" viewBox="0 0 790 653" width="790px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="legend" data-source-line="1"><rect fill="#DDDDDD" height="612.9844" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="759.376" x="12" y="22"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="399.3008" x="17" y="39.9951">The plugin you are using seems to generated a bad URL.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="295.8867" x="17" y="56.292">This URL does not look like DEFLATE data.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="367.6641" x="17" y="72.5889">It looks like your plugin is using HUFFMAN encoding.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="17" y="88.8857">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="671.7061" x="17" y="105.1826">This means you have now to add an header ~1 to your data. For example, you have to change:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="562.5088" x="17" y="121.4795">http://www.plantuml.com/plantuml/png/eNqVWM1uGzcQvuspFj4lLRw0h150KK...</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="14.0547" x="17" y="137.7764">to</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="583.1465" x="17" y="154.0732">http://www.plantuml.com/plantuml/png/~1eNqVWM1uGzcQvuspFj4lLRw0h150KK...</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="17" y="170.3701">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="138.2773" x="17" y="186.667">It will work this way</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="428.1484" x="17" y="202.9639">You may contact the PlantUML team at plantuml@gmail.com</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="749.376" x="17" y="219.2607">But you should also probably contact the plugin authors you are currently using and send them this image</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="17" y="235.5576">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="232.5449" x="17" y="251.8545">For the record, here is your data:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="17" y="268.1514">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="692.4053" x="17" y="284.4482">eNqVWM1uGzcQvuspFj4lLRw0h150KKLYaWOgMAI7iQ9FEVC7I4kxd7kguXLUNu/eIYfUcnYpJbnY5nA4</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="676.8398" x="17" y="300.7451">//PNrF9ZJ4wbWlXdg9nLrf70h9JroT5dKWHttRRbI9qFgo2rnK6M3O5c1UgDtZO6Wyxqz0VPa6j XVTV</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="686.1572" x="17" y="317.042">pWyW1b0zstv6UydayM8N2NrI3r/Oyb3B98vqdmjXYALfYAQxjbRL/PFzbUA4iBqfPfekoW mpAYU5KSv</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="683.6279" x="17" y="333.3389">ydR32riNVlLfOGhLBjvpFLO4lu7wHR7IVmzhg1E5bYOmDgZQ/mutFYju6IVoGmZJ7kjhgtyZXhydWjkn</text><text fill="#000000" font-family="sans-serif" font-